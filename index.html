<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>منظم الساعات</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #171922;
      --card-border: #242938;
      --item: #1f2330;
      --item-hover: #272d3e;
      --text: #f1f5f9;
      --muted: #8e9bb0;
      --border: #2a3042;
      --blue: #4f75ff;
      --blue-soft: #1e294b;
      --green: #2fb368;
      --green-soft: #143322;
      --toast-bg: #222634;
      --toast-text: #f1f5f9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: env(safe-area-inset-top, 16px) 16px calc(40px + env(safe-area-inset-bottom, 0px));
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .tabs-bar { display: flex; gap: 8px; background: var(--card); padding: 5px; border-radius: 14px; border: 1px solid var(--card-border); }
    .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--muted); font-size: 14px; font-weight: 700; border-radius: 10px; cursor: pointer; transition: 0.2s; }
    .tab-btn.is-active { background: var(--blue); color: #fff; }
    .card { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.25); display: flex; flex-direction: column; gap: 10px; }
    .header-row { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 16px; margin: 0; font-weight: 800; }
    .time-badge { font-size: 13px; font-weight: 700; color: #fff; background: var(--blue); padding: 4px 10px; border-radius: 20px; }
    .sub-stats { font-size: 13px; color: var(--muted); }
    .hour-clock { font-size: 12px; color: var(--muted); }
    .stacked-bar { display: flex; height: 16px; border-radius: 8px; overflow: hidden; background: var(--item); border: 1px solid var(--border); }
    .task-list { display: flex; flex-direction: column; gap: 8px; }
    .task-item { display: flex; align-items: center; justify-content: space-between; background: var(--item); padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); gap: 8px; }
    .task-meta { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
    .task-chk { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--muted); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .task-title { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .add-bar { display: flex; gap: 8px; margin-top: 4px; }
    input, select, textarea { font-size: 16px !important; }
    .input-field { background: var(--item); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 9px 12px; outline: none; }
    .input-name { flex: 1; }
    .input-mins { width: 70px; text-align: center; }
    .add-btn { background: var(--blue); color: #fff; border: none; border-radius: 10px; padding: 0 16px; font-weight: 700; cursor: pointer; }
    .icon-btn { background: var(--item); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
    .icon-btn.del { color: #f87171; }
    .timer-btn { background: var(--blue-soft); border: 1px solid var(--blue); color: #fff; border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; font-weight: 600; }
    .inbox-modal-btn { width: 100%; padding: 12px; font-weight: 700; font-size: 15px; border-radius: 12px; background: var(--item); border: 1px solid var(--border); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
    .footer-actions { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
    .copy-btn { background: var(--item); border: 1px solid var(--border); color: var(--muted); border-radius: 10px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
    .trackers-box { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
    .trackers-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .tracker-row { display: flex; align-items: center; justify-content: space-between; background: var(--item); border: 1px solid var(--border); padding: 8px 10px; border-radius: 10px; gap: 8px; }
    .tracker-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .tracker-ring { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
    .tracker-title { font-size: 14px; font-weight: 700; }
    .tracker-sub { font-size: 11px; color: var(--muted); }
    .tracker-actions { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
    .pill-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 4px 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .pill-btn.is-done { background: var(--green-soft); border-color: var(--green); color: #fff; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); backdrop-filter: blur(4px); display: flex; align-items: flex-end; z-index: 1000; }
    .modal-sheet { background: var(--card); width: 100%; max-height: 85vh; border-radius: 20px 20px 0 0; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--card-border); }
    .modal-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .modal-title-wrap { display: flex; align-items: center; gap: 8px; }
    .mini-gear-btn { background: var(--item); border: 1px solid var(--border); border-radius: 6px; font-size: 11px; padding: 3px 6px; cursor: pointer; color: var(--muted); }
    .modal-close-btn { background: var(--item); border: 1px solid var(--border); color: var(--text); width: 28px; height: 28px; border-radius: 50%; font-size: 14px; cursor: pointer; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <div class="tabs-bar">
      <button type="button" class="tab-btn is-active" id="tab-live">الساعة الحالية</button>
      <button type="button" class="tab-btn" id="tab-routine">Routine</button>
    </div>

    <!-- LIVE VIEW -->
    <div id="view-live" style="display:flex; flex-direction:column; gap:12px;">
      <div class="card">
        <div class="header-row">
          <h1>مهام الساعة الحالية</h1>
          <div class="time-badge" id="remaining-badge">٦٠ دقيقة فراغ</div>
        </div>
        <div class="sub-stats" id="sub-stats">مفيش مهام حالياً</div>
        <div class="hour-clock" id="hour-clock-hint"></div>
        <div class="stacked-bar" id="stacked-bar"></div>
      </div>

      <button type="button" class="inbox-modal-btn" id="open-inbox-btn">
        <span>📥 صندوق المهام (Inbox)</span>
        <span class="sub-stats" id="inbox-count-badge">٠ مهام</span>
      </button>

      <div class="card">
        <div class="task-list" id="task-list"></div>
        <form class="add-bar" id="add-form">
          <input type="text" class="input-field input-name" id="new-title" placeholder="اسم المهمة للساعة..." required>
          <input type="text" inputmode="numeric" class="input-field input-mins" id="new-mins" placeholder="دقيقة" required>
          <button type="submit" class="add-btn">+</button>
        </form>
      </div>

      <!-- DAILY TRACKERS COMPACT -->
      <div class="trackers-box" id="daily-trackers-box"></div>

      <!-- COMPLETED LOG -->
      <div class="card" id="completed-box">
        <div class="header-row">
          <h1>المهام المكتملة (٤٨ ساعة)</h1>
          <span class="sub-stats" id="completed-count">٠ مهام</span>
        </div>
        <div class="task-list" id="completed-list"></div>
      </div>

      <!-- FOOTER BUTTONS AT VERY BOTTOM -->
      <div class="footer-actions">
        <button type="button" class="copy-btn" id="copy-btn">نسخ الحالة لإرسالها في الشات</button>
        <button type="button" class="copy-btn" id="refresh-app-btn">↻ تحديث</button>
      </div>
    </div>

    <!-- ROUTINE VIEW -->
    <div id="view-routine" class="hidden">
      <div class="card">
        <div class="header-row">
          <h1>Routine (قالب المهام اليومية)</h1>
          <button type="button" class="icon-btn" id="toggle-trackers-history-btn">📊 سجل العدادات</button>
        </div>
        <div class="sub-stats">اضغط على اسم أو وقت أي مهمة لتعديلها.</div>
        <div class="task-list" id="routine-list"></div>
        <form class="add-bar" id="routine-form">
          <input type="text" class="input-field input-name" id="routine-title" placeholder="اسم مهمة الروتين..." required>
          <input type="text" inputmode="numeric" class="input-field input-mins" id="routine-mins" placeholder="الدقائق" required>
          <button type="submit" class="add-btn">+</button>
        </form>
        <div id="trackers-history-panel" class="hidden"></div>
      </div>
    </div>
  </div>

  <!-- INBOX MODAL -->
  <div class="modal-overlay hidden" id="inbox-modal">
    <div class="modal-sheet">
      <div class="modal-head">
        <div class="modal-title-wrap">
          <span style="font-weight:800; font-size:15px;">📥 صندوق المهام (Inbox)</span>
          <button type="button" class="mini-gear-btn" id="open-sections-mgmt">⚙️ الأقسام</button>
        </div>
        <button type="button" class="modal-close-btn" id="close-inbox-btn">✕</button>
      </div>

      <div id="inbox-sections-container" style="display:flex; flex-direction:column; gap:10px;"></div>

      <form class="add-bar" id="inbox-form">
        <input type="text" class="input-field input-name" id="inbox-title" placeholder="مهمة جديدة..." required>
        <select class="input-field" id="inbox-section-select" style="max-width:140px;"></select>
        <button type="submit" class="add-btn">+</button>
      </form>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'hourly_tracker_zen_v1';
    let TASKS = JSON.parse(localStorage.getItem(STORAGE_KEY + '_tasks') || '[]');
    let INBOX = JSON.parse(localStorage.getItem(STORAGE_KEY + '_inbox') || '[]');
    let ROUTINE = JSON.parse(localStorage.getItem(STORAGE_KEY + '_routine') || '[]');
    let COMPLETED = JSON.parse(localStorage.getItem(STORAGE_KEY + '_completed') || '[]');
    let SECTIONS = JSON.parse(localStorage.getItem(STORAGE_KEY + '_sections') || JSON.stringify([
      { id: 'sec_1', name: 'النصف الأول من اليوم', color: '#4f75ff' },
      { id: 'sec_2', name: 'النصف الثاني من اليوم', color: '#e09f3e' }
    ]));
    let TRACKERS = JSON.parse(localStorage.getItem(STORAGE_KEY + '_trackers') || JSON.stringify([
      { id: 'salat', name: 'الصلاة', type: 'checks', items: ['فجر', 'ظهر', 'عصر', 'مغرب', 'عشاء'], val: [false,false,false,false,false], color: '#2fb368' },
      { id: 'water', name: 'المياه', type: 'num', step: 200, goal: 2500, unit: 'مل', val: 0, color: '#06b6d4' },
      { id: 'steps', name: 'الخطوات', type: 'num', step: 500, goal: 5000, unit: 'خطوة', val: 0, color: '#f59e0b' },
      { id: 'charity', name: 'الصدقات', type: 'checks', items: ['صدقة النهار', 'صدقة الليل'], val: [false,false], color: '#ec4899' },
      { id: 'teeth', name: 'غسيل الأسنان', type: 'checks', items: ['الصبح', 'بالليل'], val: [false,false], color: '#8b5cf6' },
      { id: 'quran', name: 'القرآن', type: 'num', step: 1, goal: 5, unit: 'صفحة', val: 0, color: '#10b981' }
    ]));

    function saveAll() {
      localStorage.setItem(STORAGE_KEY + '_tasks', JSON.stringify(TASKS));
      localStorage.setItem(STORAGE_KEY + '_inbox', JSON.stringify(INBOX));
      localStorage.setItem(STORAGE_KEY + '_routine', JSON.stringify(ROUTINE));
      localStorage.setItem(STORAGE_KEY + '_completed', JSON.stringify(COMPLETED));
      localStorage.setItem(STORAGE_KEY + '_sections', JSON.stringify(SECTIONS));
      localStorage.setItem(STORAGE_KEY + '_trackers', JSON.stringify(TRACKERS));
    }

    function checkDailyReset() {
      const now = new Date();
      const lastReset = localStorage.getItem(STORAGE_KEY + '_last_reset');
      const resetThreshold = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 3, 0, 0);
      if (now < resetThreshold) resetThreshold.setDate(resetThreshold.getDate() - 1);
      if (!lastReset || new Date(lastReset) < resetThreshold) {
        TRACKERS.forEach(t => {
          if (t.type === 'checks') t.val = t.items.map(() => false);
          else t.val = 0;
        });
        localStorage.setItem(STORAGE_KEY + '_last_reset', now.toISOString());
        saveAll();
      }
    }
    checkDailyReset();

    function render() {
      const minsUsed = TASKS.reduce((acc, t) => acc + (t.mins || 0), 0);
      const minsLeft = Math.max(0, 60 - minsUsed);
      document.getElementById('remaining-badge').textContent = `${minsLeft} دقيقة فراغ`;
      document.getElementById('sub-stats').textContent = TASKS.length ? `${TASKS.length} مهام محددة` : 'مفيش مهام حالياً';
      document.getElementById('inbox-count-badge').textContent = `${INBOX.length} مهام`;

      const barEl = document.getElementById('stacked-bar');
      barEl.innerHTML = TASKS.map(t => `<div style="flex:${t.mins}; background:var(--blue); border-left:1px solid var(--border);" title="${t.title}"></div>`).join('') +
                        `<div style="flex:${minsLeft}; background:transparent;"></div>`;

      const taskList = document.getElementById('task-list');
      taskList.innerHTML = TASKS.map((t, idx) => `
        <div class="task-item">
          <div class="task-meta">
            <span class="task-chk" onclick="completeTask(${idx})"></span>
            <span class="task-title">${t.title}</span>
          </div>
          <div style="display:flex; align-items:center; gap:6px;">
            <span class="sub-stats">${t.mins} د</span>
            <button class="icon-btn del" onclick="removeTask(${idx})">×</button>
          </div>
        </div>
      `).join('') || '<div class="sub-stats" style="text-align:center; padding:8px;">لا توجد مهام مضافة لهذه الساعة</div>';

      const trackersBox = document.getElementById('daily-trackers-box');
      trackersBox.innerHTML = `
        <div class="trackers-header">
          <span style="font-weight:800; font-size:14px;">عدادات اليوم</span>
        </div>
        ${TRACKERS.map((t, tidx) => {
          let ringText = '', isDone = false;
          if (t.type === 'checks') {
            const doneCount = t.val.filter(Boolean).length;
            ringText = `${doneCount}/${t.items.length}`;
            isDone = doneCount === t.items.length;
          } else {
            ringText = `${Math.min(100, Math.round((t.val/t.goal)*100))}%`;
            isDone = t.val >= t.goal;
          }
          return `
            <div class="tracker-row">
              <div class="tracker-left">
                <div class="tracker-ring" style="background:${isDone ? 'var(--green-soft)' : 'var(--bg)'}; border:1px solid ${isDone ? 'var(--green)' : 'var(--border)'}; color:${isDone ? 'var(--green)' : 'var(--text)'};">
                  ${ringText}
                </div>
                <div>
                  <div class="tracker-title">${t.name}</div>
                  <div class="tracker-sub">${t.type === 'checks' ? '' : `${t.val} / ${t.goal} ${t.unit}`}</div>
                </div>
              </div>
              <div class="tracker-actions">
                ${t.type === 'checks' ? t.items.map((it, i) => `
                  <button class="pill-btn ${t.val[i] ? 'is-done' : ''}" onclick="toggleTrackerCheck(${tidx}, ${i})">${it}</button>
                `).join('') : `
                  <button class="pill-btn" onclick="stepTrackerNum(${tidx}, -${t.step})">-${t.step}</button>
                  <button class="pill-btn is-done" onclick="stepTrackerNum(${tidx}, ${t.step})">+${t.step}</button>
                `}
              </div>
            </div>
          `;
        }).join('')}
      `;

      document.getElementById('completed-count').textContent = `${COMPLETED.length} مهام`;
      document.getElementById('completed-list').innerHTML = COMPLETED.slice(0, 8).map(c => `
        <div class="task-item" style="opacity:0.75;">
          <span class="task-title" style="text-decoration:line-through;">${c.title}</span>
          <span class="sub-stats">${c.mins} د</span>
        </div>
      `).join('') || '<div class="sub-stats" style="text-align:center;">لا توجد مهام مكتملة مؤخراً</div>';

      const routineList = document.getElementById('routine-list');
      routineList.innerHTML = ROUTINE.map((r, ridx) => `
        <div class="task-item">
          <div class="task-meta">
            <span class="task-title" onclick="editRoutine(${ridx})">${r.title}</span>
          </div>
          <div style="display:flex; align-items:center; gap:6px;">
            <span class="sub-stats" onclick="editRoutine(${ridx})">${r.mins} د</span>
            <button class="timer-btn" onclick="addRoutineToLive(${ridx})">إضافة للساعة</button>
            <button class="icon-btn del" onclick="removeRoutine(${ridx})">×</button>
          </div>
        </div>
      `).join('') || '<div class="sub-stats" style="text-align:center;">لا توجد مهام روتين</div>';

      renderInboxModal();
    }

    function renderInboxModal() {
      const container = document.getElementById('inbox-sections-container');
      const select = document.getElementById('inbox-section-select');
      select.innerHTML = SECTIONS.map(s => `<option value="${s.id}">${s.name}</option>`).join('');

      container.innerHTML = SECTIONS.map(s => {
        const items = INBOX.filter(i => i.sectionId === s.id);
        return `
          <div style="background:var(--item); border:1px solid var(--border); border-radius:12px; padding:10px;">
            <div style="font-weight:700; font-size:13px; color:${s.color}; margin-bottom:6px;">${s.name} (${items.length})</div>
            <div style="display:flex; flex-direction:column; gap:6px;">
              ${items.map(it => `
                <div style="display:flex; align-items:center; justify-content:space-between; background:var(--bg); padding:6px 10px; border-radius:8px;">
                  <span style="font-size:14px;">${it.title}</span>
                  <div style="display:flex; gap:6px;">
                    <button class="timer-btn" style="padding:3px 8px; font-size:11px;" onclick="addInboxToLive('${it.id}')">إضافة للساعة</button>
                    <button class="icon-btn del" style="padding:2px 6px;" onclick="removeInbox('${it.id}')">×</button>
                  </div>
                </div>
              `).join('') || '<span class="sub-stats" style="font-size:11px;">فارغ</span>'}
            </div>
          </div>
        `;
      }).join('');
    }

    window.completeTask = (idx) => {
      COMPLETED.unshift(TASKS[idx]);
      TASKS.splice(idx, 1);
      saveAll();
      render();
    };
    window.removeTask = (idx) => {
      TASKS.splice(idx, 1);
      saveAll();
      render();
    };
    window.toggleTrackerCheck = (tidx, i) => {
      TRACKERS[tidx].val[i] = !TRACKERS[tidx].val[i];
      saveAll();
      render();
    };
    window.stepTrackerNum = (tidx, delta) => {
      TRACKERS[tidx].val = Math.max(0, TRACKERS[tidx].val + delta);
      saveAll();
      render();
    };
    window.removeRoutine = (idx) => {
      ROUTINE.splice(idx, 1);
      saveAll();
      render();
    };
    window.editRoutine = (idx) => {
      const title = prompt('تعديل اسم المهمة:', ROUTINE[idx].title);
      const mins = prompt('تعديل المدة (بالدقائق):', ROUTINE[idx].mins);
      if (title) ROUTINE[idx].title = title;
      if (mins) ROUTINE[idx].mins = parseInt(mins, 10) || ROUTINE[idx].mins;
      saveAll();
      render();
    };
    window.addRoutineToLive = (idx) => {
      const r = ROUTINE[idx];
      TASKS.push({ title: r.title, mins: r.mins });
      saveAll();
      render();
    };
    window.removeInbox = (id) => {
      INBOX = INBOX.filter(i => i.id !== id);
      saveAll();
      render();
    };
    window.addInboxToLive = (id) => {
      const it = INBOX.find(i => i.id === id);
      const mins = prompt(`كم دقيقة للمهمة "${it.title}"؟ (أقصى وقت 60 دقيقة)`, '15');
      const parsed = Math.min(60, parseInt(mins, 10) || 15);
      TASKS.push({ title: it.title, mins: parsed });
      INBOX = INBOX.filter(i => i.id !== id);
      saveAll();
      render();
    };

    document.getElementById('add-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('new-title').value.trim();
      const mins = Math.min(60, parseInt(document.getElementById('new-mins').value, 10) || 15);
      if (title) {
        TASKS.push({ title, mins });
        document.getElementById('new-title').value = '';
        document.getElementById('new-mins').value = '';
        saveAll();
        render();
      }
    });

    document.getElementById('inbox-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('inbox-title').value.trim();
      const sectionId = document.getElementById('inbox-section-select').value;
      if (title) {
        INBOX.push({ id: 'inb_' + Date.now(), title, sectionId });
        document.getElementById('inbox-title').value = '';
        saveAll();
        render();
      }
    });

    document.getElementById('routine-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('routine-title').value.trim();
      const mins = parseInt(document.getElementById('routine-mins').value, 10) || 15;
      if (title) {
        ROUTINE.push({ title, mins });
        document.getElementById('routine-title').value = '';
        document.getElementById('routine-mins').value = '';
        saveAll();
        render();
      }
    });

    const inboxModal = document.getElementById('inbox-modal');
    document.getElementById('open-inbox-btn').addEventListener('click', () => inboxModal.classList.remove('hidden'));
    document.getElementById('close-inbox-btn').addEventListener('click', () => inboxModal.classList.add('hidden'));

    document.getElementById('tab-live').addEventListener('click', () => {
      document.getElementById('tab-live').classList.add('is-active');
      document.getElementById('tab-routine').classList.remove('is-active');
      document.getElementById('view-live').classList.remove('hidden');
      document.getElementById('view-routine').classList.add('hidden');
    });

    document.getElementById('tab-routine').addEventListener('click', () => {
      document.getElementById('tab-routine').classList.add('is-active');
      document.getElementById('tab-live').classList.remove('is-active');
      document.getElementById('view-routine').classList.remove('hidden');
      document.getElementById('view-live').classList.add('hidden');
    });

    document.getElementById('refresh-app-btn').addEventListener('click', () => location.reload());
    document.getElementById('copy-btn').addEventListener('click', () => {
      const txt = TASKS.map(t => `- ${t.title} (${t.mins} د)`).join('
') || 'لا توجد مهام';
      navigator.clipboard.writeText(txt).then(() => alert('تم نسخ حالة المهام'));
    });

    render();
  </script>
</body>
</html>
